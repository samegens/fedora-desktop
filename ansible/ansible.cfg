[defaults]
stdout_callback = debug
host_key_checking = False
vault_password_file = ./vault-client.sh
inventory = inventory
roles_path = ./roles

[ssh_connection]
pipelining=True
ssh_args=-C -o ControlMaster=auto -o ControlPersist=60s -o UserKnownHostsFile=/dev/null

[paramiko_connection]
record_host_keys = False
