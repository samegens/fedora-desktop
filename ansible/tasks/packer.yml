---

- name: Install Packer.
  tags: packer
  block:
    - name: Add HashiCorp repository.
      ansible.builtin.get_url:
        url: https://rpm.releases.hashicorp.com/fedora/hashicorp.repo
        dest: /etc/yum.repos.d/hashicorp.repo
        mode: '0644'

    - name: Install Packer. # noqa: package-latest
      ansible.builtin.dnf:
        name: packer
        state: latest
