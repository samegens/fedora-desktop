---
- name: Configure KDE Plasma
  when: use_kde
  tags: kde
  block:
    - name: Disable shortcut Ctrl-F3 (needed for vscode)
      ansible.builtin.lineinfile:
        path: /home/{{ username }}/.config/kglobalshortcutsrc
        regexp: '^Switch to Desktop 3=.*'
        line: 'Switch to Desktop 3=none,Ctrl+F3,Switch to Desktop 3'
        state: present

    - name: Get touchpad device info
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          block=$(awk 'BEGIN{RS=""; FS="\n"} /N:.*[Tt]ouchpad/{print; exit}' /proc/bus/input/devices)
          name=$(echo "$block" | grep "^N:" | sed 's/N: Name="\(.*\)"/\1/')
          vendor_hex=$(echo "$block" | grep "^I:" | grep -oP '(?<=Vendor=)[0-9a-fA-F]+')
          product_hex=$(echo "$block" | grep "^I:" | grep -oP '(?<=Product=)[0-9a-fA-F]+')
          vendor_dec=$((16#$vendor_hex))
          product_dec=$((16#$product_hex))
          echo "${vendor_dec}|${product_dec}|${name}"
        executable: /bin/bash
      register: touchpad_info
      changed_when: false
      check_mode: false

    - name: Set touchpad device facts
      ansible.builtin.set_fact:
        touchpad_vendor_id: "{{ touchpad_info.stdout.split('|')[0] }}"
        touchpad_product_id: "{{ touchpad_info.stdout.split('|')[1] }}"
        touchpad_name: "{{ touchpad_info.stdout.split('|')[2] }}"

    - name: Change touchpad settings
      community.general.ini_file:
        path: "/home/{{ username }}/.config/kcminputrc"
        section: "Libinput][{{ touchpad_vendor_id }}][{{ touchpad_product_id }}][{{ touchpad_name }}"
        option: "{{ item.option }}"
        value: "{{ item.value }}"
        ignore_spaces: true
        mode: '0644'
        owner: "{{ username }}"
        group: "{{ username }}"
      loop:
        - option: NaturalScroll
          value: "true"
          description: Use natural scrolling (backwards scrolls down)
        - option: TapDragLock
          value: "true"
          description: Dragging continues after shortly lifting fingers
        - option: TapToClick
          value: "true"
          description: Tap performs click
      loop_control:
        label: "{{ item.description }}"

    - name: Change some Plasma settings
      community.general.ini_file:
        path: /home/{{ username }}/.config/plasma-org.kde.plasma.desktop-appletsrc
        section: "Containments][2][Applets][5][Configuration][General"
        option: "{{ item.option }}"
        value: "{{ item.value }}"
        ignore_spaces: true
        create: false
      loop:
        - option: groupingStrategy
          value: 0
          description: Don't group icons
        - option: highlightWindows
          value: "false"
          description: Don't highlight application when hovering over icon
      loop_control:
        label: "{{ item.description }}"

    - name: Set task switcher to Thumbnail Grid style
      community.general.ini_file:
        path: "/home/{{ username }}/.config/kwinrc"
        section: TabBox
        option: LayoutName
        value: thumbnail_grid
        ignore_spaces: true
        create: false

    - name: Configure KDE power management
      ansible.builtin.copy:
        dest: "/home/{{ username }}/.config/powerdevilrc"
        owner: "{{ username }}"
        group: "{{ username }}"
        mode: '0644'
        content: |
          [AC][Display]
          DimDisplay=false
          DimDisplayIdleTimeoutSec=-1
          DimDisplayWhenIdle=false
          TurnOffDisplayIdleTimeoutSec=900

          [AC][SuspendAndShutdown]
          AutoSuspendAction=0
          InhibitLidActionWhenExternalMonitorPresent=false
          PowerButtonAction=1

          [Battery][SuspendAndShutdown]
          InhibitLidActionWhenExternalMonitorPresent=false
          PowerButtonAction=1

          [LowBattery][SuspendAndShutdown]
          InhibitLidActionWhenExternalMonitorPresent=false
          PowerButtonAction=1
