---
- name: Install Brother DCP-1610W software
  tags: printer
  block:
    - name: Install CUPS and scanning support
      ansible.builtin.dnf:
        name:
          - cups          # printing via IPP Everywhere (driverless)
          - sane-backends # scanning support
          - simple-scan   # scanning frontend
        state: present

    - name: Enable and start CUPS
      ansible.builtin.systemd:
        name: cups
        enabled: true
        state: started
