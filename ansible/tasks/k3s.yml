---
- name: Install k3s
  tags: k3s
  block:
    - name: Check if k3s is already installed
      ansible.builtin.stat:
        path: /usr/local/bin/k3s
      register: k3s_stat_result

    - name: Download k3s install script
      ansible.builtin.get_url:
        url: https://get.k3s.io
        dest: /root/k3s-install.sh
        mode: "0755"
      when: not k3s_stat_result.stat.exists

    - name: Install k3s
      ansible.builtin.command:
        cmd: /root/k3s-install.sh
      environment:
        INSTALL_K3S_SKIP_START: "false"
        INSTALL_K3S_EXEC: server --write-kubeconfig-mode=0644
      when: not k3s_stat_result.stat.exists
      changed_when: true

    - name: Create k3s systemd drop-in directory
      ansible.builtin.file:
        path: /etc/systemd/system/k3s.service.d
        state: directory
        mode: "0755"

    # To prevent k3s.yaml to become unaccessible to the main user after each update we have to
    # tell k3s to always write that file using mode 0644.
    - name: Set kubeconfig permissions via systemd drop-in
      ansible.builtin.copy:
        dest: /etc/systemd/system/k3s.service.d/kubeconfig-mode.conf
        content: |
          [Service]
          Environment="K3S_KUBECONFIG_MODE=0644"
        mode: "0644"
      register: config_result

    - name: Reload systemd and restart k3s if drop-in changed
      ansible.builtin.systemd:
        name: k3s
        daemon_reload: true
        state: restarted
      when: config_result.changed # noqa: no-handler

    - name: Ensure k3s service is enabled and started
      ansible.builtin.systemd:
        name: k3s
        enabled: true
        state: started

    - name: Trust k3s pod and service networks in firewalld
      ansible.posix.firewalld:
        zone: trusted
        source: "{{ item }}"
        permanent: true
        immediate: true
        state: enabled
      loop:
        - 10.42.0.0/16
        - 10.43.0.0/16

    - name: Fix kubeconfig permissions
      ansible.builtin.file:
        path: /etc/rancher/k3s/k3s.yaml
        mode: "0644"

    - name: Check if helm is already installed
      ansible.builtin.stat:
        path: /usr/local/bin/helm
      register: helm_stat_result

    - name: Download Helm v4.0.4
      ansible.builtin.get_url:
        url: https://get.helm.sh/helm-v4.0.4-linux-amd64.tar.gz
        dest: /root/helm-v4.0.4-linux-amd64.tar.gz
        mode: "0644"
      when: not helm_stat_result.stat.exists

    - name: Extract Helm archive
      ansible.builtin.unarchive:
        src: /root/helm-v4.0.4-linux-amd64.tar.gz
        dest: /root
        remote_src: true
      when: not helm_stat_result.stat.exists

    - name: Install Helm binary
      ansible.builtin.copy:
        src: /root/linux-amd64/helm
        dest: /usr/local/bin/helm
        mode: "0755"
        remote_src: true
      when: not helm_stat_result.stat.exists

    - name: Verify Helm installation
      ansible.builtin.command:
        cmd: helm version
      register: helm_version_result
      changed_when: false

    - name: Display Helm version
      ansible.builtin.debug:
        var: helm_version_result.stdout

    - name: Check if k9s is already installed
      ansible.builtin.stat:
        path: /usr/local/bin/k9s
      register: k9s_stat_result

    - name: Download k9s
      ansible.builtin.get_url:
        url: "https://github.com/derailed/k9s/releases/download/v{{ k9s_version
          }}/k9s_Linux_amd64.tar.gz"
        dest: /root/k9s_Linux_amd64.tar.gz
        mode: "0644"
      when: not k9s_stat_result.stat.exists

    - name: Extract k9s binary
      ansible.builtin.unarchive:
        src: /root/k9s_Linux_amd64.tar.gz
        dest: /usr/local/bin
        remote_src: true
        mode: "0755"
        owner: root
        group: root
        extra_opts:
          - k9s
      when: not k9s_stat_result.stat.exists
