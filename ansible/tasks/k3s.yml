---
- name: Install k3s
  tags: k3s
  block:
    - name: Check if k3s is already installed
      ansible.builtin.stat:
        path: /usr/local/bin/k3s
      register: k3s_stat_result

    - name: Download k3s install script
      ansible.builtin.get_url:
        url: https://get.k3s.io
        dest: /root/k3s-install.sh
        mode: "0755"
      when: not k3s_stat_result.stat.exists

    - name: Install k3s
      ansible.builtin.command:
        cmd: /root/k3s-install.sh
      environment:
        INSTALL_K3S_SKIP_START: "false"
        INSTALL_K3S_EXEC: server
      when: not k3s_stat_result.stat.exists
      changed_when: true

    - name: Ensure k3s service is enabled and started
      ansible.builtin.systemd:
        name: k3s
        enabled: true
        state: started

    - name: Add user to adm group for kubeconfig access
      ansible.builtin.user:
        name: "{{ username }}"
        groups: adm
        append: true

    - name: Trust k3s pod and service networks in firewalld
      ansible.posix.firewalld:
        zone: trusted
        source: "{{ item }}"
        permanent: true
        immediate: true
        state: enabled
      loop:
        - 10.42.0.0/16
        - 10.43.0.0/16

    - name: Check if helm is already installed
      ansible.builtin.stat:
        path: /usr/local/bin/helm
      register: helm_stat_result

    - name: Download Helm v4.0.4
      ansible.builtin.get_url:
        url: https://get.helm.sh/helm-v4.0.4-linux-amd64.tar.gz
        dest: /root/helm-v4.0.4-linux-amd64.tar.gz
        mode: "0644"
      when: not helm_stat_result.stat.exists

    - name: Extract Helm archive
      ansible.builtin.unarchive:
        src: /root/helm-v4.0.4-linux-amd64.tar.gz
        dest: /root
        remote_src: true
      when: not helm_stat_result.stat.exists

    - name: Install Helm binary
      ansible.builtin.copy:
        src: /root/linux-amd64/helm
        dest: /usr/local/bin/helm
        mode: "0755"
        remote_src: true
      when: not helm_stat_result.stat.exists

    - name: Verify Helm installation
      ansible.builtin.command:
        cmd: helm version
      register: helm_version_result
      changed_when: false

    - name: Display Helm version
      ansible.builtin.debug:
        var: helm_version_result.stdout

    - name: Check if k9s is already installed
      ansible.builtin.stat:
        path: /usr/local/bin/k9s
      register: k9s_stat_result

    - name: Download k9s
      ansible.builtin.get_url:
        url: "https://github.com/derailed/k9s/releases/download/v{{ k9s_version
          }}/k9s_Linux_amd64.tar.gz"
        dest: /root/k9s_Linux_amd64.tar.gz
        mode: "0644"
      when: not k9s_stat_result.stat.exists

    - name: Extract k9s binary
      ansible.builtin.unarchive:
        src: /root/k9s_Linux_amd64.tar.gz
        dest: /usr/local/bin
        remote_src: true
        mode: "0755"
        owner: root
        group: root
        extra_opts:
          - k9s
      when: not k9s_stat_result.stat.exists
