---
- name: Configure Python virtual environments
  tags: python-venv
  block:
    - name: Install python3-virtualenv
      ansible.builtin.dnf:
        name: python3-virtualenv
        state: present

    - name: Create root dir for Python virtualenvs
      ansible.builtin.file:
        path: /home/{{ username }}/python3-venv
        state: directory
        mode: "0755"
        owner: "{{ username }}"
        group: "{{ username }}"

    - name: Create python venv for Ansible
      ansible.builtin.command:
        cmd: python3 -m venv ~/python3-venv/ansible-latest
        creates: "~/python3-venv/ansible-latest/bin/activate"
      become: true
      become_user: "{{ username }}"

    - name: Install dependencies in the virtualenv
      ansible.builtin.pip:
        name:
          - ansible
          - ansible-lint
          - librouteros
          - detect-secrets
          - passlib           # needed for password_hash filter
        virtualenv: ~/python3-venv/ansible-latest
        virtualenv_python: python3
      become: true
      become_user: "{{ username }}"

    - name: Create python venv for blauwe-lucht-rpa
      ansible.builtin.command:
        cmd: python3 -m venv ~/python3-venv/blauwe-lucht-rpa
        creates: "~/python3-venv/blauwe-lucht-rpa/bin/activate"
      become: true
      become_user: "{{ username }}"

    - name: Install pip packages for blauwe-lucht-rpa
      ansible.builtin.pip:
        name:
          - rpa
          - gspread
          - oauth2client
          - reportlab
          - pypdf
        virtualenv: ~/python3-venv/blauwe-lucht-rpa
        virtualenv_python: python3
      become: true
      become_user: "{{ username }}"
