---
- name: Create user Kate
  tags: kate
  block:
    - name: Create user {{ kate_username }}
      ansible.builtin.user:
        name: "{{ kate_username }}"
        comment: Kate
        shell: /bin/bash
        create_home: true
        password: "{{ kate_password | string | password_hash('sha512') }}"
        update_password: on_create
        state: present
