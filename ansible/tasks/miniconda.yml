---
- name: Install Miniconda and configure conda environments
  tags: miniconda
  block:
    - name: Check if Miniconda is already installed
      ansible.builtin.stat:
        path: /home/{{ username }}/miniconda3/bin/conda
      register: miniconda_stat_result

    - name: Download and install Miniconda
      when: not miniconda_stat_result.stat.exists
      block:
        - name: Download Miniconda installer
          ansible.builtin.get_url:
            url: https://repo.anaconda.com/miniconda/Miniconda3-latest-Linux-x86_64.sh
            dest: /tmp/Miniconda3-latest-Linux-x86_64.sh
            mode: "0755"

        - name: Install Miniconda
          ansible.builtin.command:
            cmd: bash /tmp/Miniconda3-latest-Linux-x86_64.sh -b -p ~/miniconda3
          changed_when: true
          become: true
          become_user: "{{ username }}"

        - name: Accept conda Terms of Service for pkgs/main
          ansible.builtin.command:
            cmd: ~/miniconda3/bin/conda tos accept --override-channels --channel https://repo.anaconda.com/pkgs/main
          changed_when: true
          become: true
          become_user: "{{ username }}"

        - name: Accept conda Terms of Service for pkgs/r
          ansible.builtin.command:
            cmd: ~/miniconda3/bin/conda tos accept --override-channels --channel https://repo.anaconda.com/pkgs/r
          changed_when: true
          become: true
          become_user: "{{ username }}"

    - name: Create homedisplay conda environment with Python 3.7
      ansible.builtin.command:
        cmd: ~/miniconda3/bin/conda create -n homedisplay python=3.7 -y
        creates: "~/miniconda3/envs/homedisplay"
      become: true
      become_user: "{{ username }}"

    - name: Install pip packages in homedisplay conda environment
      ansible.builtin.pip:
        name:
          - certifi
          - charset-normalizer
          - idna
          - influxdb
          - msgpack
          - pygame
          - python-dateutil
          - pytz
          - requests
          - six
          - urllib3
        executable: /home/{{ username }}/miniconda3/envs/homedisplay/bin/pip
      become: true
      become_user: "{{ username }}"
