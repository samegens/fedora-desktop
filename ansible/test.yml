---
- name: Test Ubuntu desktop configuration
  hosts: all
  become: true
  become_user: "{{ username }}"
  vars:
    # Data-driven test configuration
    executables_to_test:
      # System tools
      - name: git
        path: /usr/bin/git
        version_command: git --version
        expected_output_regex: "^git version"

      - name: docker
        path: /usr/bin/docker
        version_command: docker --version
        expected_output_regex: "^Docker version"

      - name: terraform
        path: /usr/local/bin/terraform
        version_command: terraform --version
        expected_output_regex: "^Terraform"

      - name: vagrant
        path: /usr/bin/vagrant
        version_command: vagrant --version
        expected_output_regex: "^Vagrant"

      - name: cinc-auditor
        path: /opt/cinc-auditor/bin/cinc-auditor
        version_command: /opt/cinc-auditor/bin/cinc-auditor --version
        expected_output_regex: "^[0-9]"

      # CLI tools
      - name: starship
        path: /usr/local/bin/starship
        version_command: starship --version
        expected_output_regex: "^starship"

      - name: fastfetch
        path: /usr/local/bin/fastfetch
        version_command: fastfetch --version
        expected_output_regex: "^fastfetch"

      - name: az
        path: /usr/bin/az
        version_command: az version
        expected_output_regex: "azure-cli"

      - name: claude
        path: /usr/bin/claude
        version_command: claude --version
        expected_output_regex: "^[0-9]"

      # Development tools
      - name: code
        path: /usr/bin/code
        version_command: code --version
        expected_output_regex: "^[0-9]"

      - name: go
        path: /usr/local/go/bin/go
        version_command: /usr/local/go/bin/go version
        expected_output_regex: "^go version"

      - name: rustc
        path: /home/{{ username }}/.cargo/bin/rustc
        version_command: /home/{{ username }}/.cargo/bin/rustc --version
        expected_output_regex: "^rustc"

      - name: cargo
        path: /home/{{ username }}/.cargo/bin/cargo
        version_command: /home/{{ username }}/.cargo/bin/cargo --version
        expected_output_regex: "^cargo"

  tasks:
    - name: Test executable exists and is in correct location
      ansible.builtin.stat:
        path: "{{ item.path }}"
      register: executable_stat
      loop: "{{ executables_to_test }}"
      loop_control:
        label: "{{ item.name }}"
      failed_when: not executable_stat.stat.exists or not executable_stat.stat.executable

    - name: Test executable can run and return version
      ansible.builtin.command:
        cmd: "{{ item.version_command }}"
      register: version_output
      loop: "{{ executables_to_test }}"
      loop_control:
        label: "{{ item.name }}"
      changed_when: false
      failed_when: version_output.rc != 0 or not (version_output.stdout | regex_search(item.expected_output_regex))

    - name: Check Node.js version
      ansible.builtin.command:
        cmd: node --version
      register: node_version_output
      changed_when: false

    - name: Verify Node.js version is >= 20
      ansible.builtin.assert:
        that:
          - node_version_output.stdout | regex_replace('^v', '') is version('20.0.0', '>=')
        fail_msg: "Node.js version {{ node_version_output.stdout }} is less than required version 20.0.0"
        success_msg: "Node.js version {{ node_version_output.stdout }} meets requirement (>= 20.0.0)"

    - name: Check npm version
      ansible.builtin.command:
        cmd: npm --version
      register: npm_version_output
      changed_when: false

    - name: Verify npm version is >= 10
      ansible.builtin.assert:
        that:
          - npm_version_output.stdout is version('10.0.0', '>=')
        fail_msg: "npm version {{ npm_version_output.stdout }} is less than required version 10.0.0"
        success_msg: "npm version {{ npm_version_output.stdout }} meets requirement (>= 10.0.0)"
